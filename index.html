<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F0EA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1024">
<meta name="color-scheme" content="light dark">
<title>Rechelle Suico</title>
<meta name="description" content="You tapped Rechelle's keychain. Say hi on Facebook or Instagram.">
<meta property="og:title" content="Rechelle Suico">
<meta property="og:description" content="You tapped Rechelle's keychain. Come say hi on Facebook or Instagram.">
<meta property="og:type" content="profile">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* NFC landing page. One standing character on a lit stage, navy + gold,
   editorial serif name. Motion: idle sway only; she steps toward a link
   when it is offered. transform/opacity only. */
:root{
  --paper:#F2F0EA; --ink:#141A33; --ink-soft:#5A6180;
  --navy:#1E2850; --gold:#C8963C; --gold-soft:#E7C98A;
  --stage:rgba(255,255,255,.85); --beam:rgba(240,226,196,.75); --cool:rgba(197,212,245,.7);
  --card:#FFFFFF; --card-line:rgba(20,26,51,.09);
  --shadow:rgba(30,40,80,.3); --contact:rgba(30,40,80,.28);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0B1024; --ink:#F3F1EA; --ink-soft:#A2A8C6;
    --stage:rgba(60,72,130,.5); --beam:rgba(200,150,60,.3); --cool:rgba(60,90,180,.35);
    --card:rgba(255,255,255,.07); --card-line:rgba(255,255,255,.14);
    --shadow:rgba(0,0,0,.6); --contact:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --paper:#0B1024; --ink:#F3F1EA; --ink-soft:#A2A8C6;
  --stage:rgba(60,72,130,.5); --beam:rgba(200,150,60,.3); --cool:rgba(60,90,180,.35);
  --card:rgba(255,255,255,.07); --card-line:rgba(255,255,255,.14);
  --shadow:rgba(0,0,0,.6); --contact:rgba(0,0,0,.65);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--paper);-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none;
  scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);background:var(--paper);overflow-x:hidden;
  font-family:Inter,"Segoe UI",system-ui,sans-serif}
a,button,[role="button"]{touch-action:manipulation}

/* stage: one warm beam, one cool fill, both drifting slowly */
.stage{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--paper)}
.glow{position:absolute;display:block;border-radius:50%;filter:blur(64px);will-change:transform}
.g1{width:88vmax;height:88vmax;left:50%;top:-34vmax;margin-left:-44vmax;background:var(--stage);
  animation:drift1 24s ease-in-out infinite alternate}
.g2{width:52vmax;height:52vmax;right:-18vmax;top:-6vmax;background:var(--beam);
  animation:drift2 29s ease-in-out infinite alternate}
.g3{width:56vmax;height:56vmax;left:-22vmax;top:26vmax;background:var(--cool);
  animation:drift3 34s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(0,6vmax,0) scale(1.06)}}
@keyframes drift2{to{transform:translate3d(-12vmax,14vmax,0) scale(.92)}}
@keyframes drift3{to{transform:translate3d(14vmax,-10vmax,0) scale(1.1)}}

.page{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100svh;
  padding:16px 22px 28px;display:flex;flex-direction:column}

.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:9px;
  padding:7px 15px;border-radius:999px;background:var(--card);border:1px solid var(--card-line);
  font-size:.84rem;font-weight:500;letter-spacing:.01em;color:var(--ink-soft);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);
  animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(200,150,60,.5)}100%{box-shadow:0 0 0 9px rgba(200,150,60,0)}}

/* hero */
.hero{position:relative;flex:1 1 auto;min-height:260px;display:grid;place-items:end center;padding-bottom:22px;margin:2px 0 0}
.floor{position:absolute;left:50%;bottom:28px;width:100px;height:16px;margin-left:-50px;
  border-radius:50%;background:var(--contact);filter:blur(13px);transform-origin:50% 50%;
  animation:breathe-shadow 5.4s ease-in-out infinite}
@keyframes breathe-shadow{50%{transform:scale(1.07,.9);opacity:.84}}
.figure{position:relative;width:112px;outline:none;cursor:pointer;border-radius:28px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  animation:arrive 1s .1s both var(--ease-out)}
@keyframes arrive{from{opacity:0;transform:translate3d(0,42px,0) scale(.97)}to{opacity:1;transform:none}}
.figure:focus-visible{outline:2px solid var(--gold);outline-offset:8px}
.mover{transform-origin:50% 100%;will-change:transform}
.her{display:block;width:100%;height:auto;pointer-events:none;transform-origin:50% 96%;
  filter:drop-shadow(0 18px 20px var(--shadow))}
.her.hop{animation:hop .62s var(--ease-out)}
@keyframes hop{
  0%{transform:scale(1,1)}
  22%{transform:scale(1.035,.95)}
  48%{transform:translate3d(0,-14px,0) scale(.985,1.03)}
  74%{transform:scale(1.015,.99)}
  100%{transform:scale(1,1)}}

.bubble{position:absolute;top:2px;left:0;z-index:5;pointer-events:none;max-width:54%;
  background:var(--navy);color:#fff;font-size:.92rem;font-weight:500;line-height:1.3;
  padding:9px 15px;border-radius:16px 16px 16px 4px;box-shadow:0 12px 26px var(--shadow);
  opacity:0;transform:translate3d(0,6px,0) scale(.96);transform-origin:0 100%;
  transition:opacity .22s var(--ease-out),transform .22s var(--ease-out)}
.bubble.show{opacity:1;transform:none}
.tap{position:absolute;left:0;right:0;bottom:0;margin:0;text-align:center;
  font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);opacity:.75}

/* name */
.intro{margin-top:10px}
.role{margin:0 0 6px;font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(2.1rem,10vw,2.9rem);
  line-height:1;letter-spacing:-.02em}
.intro p{margin:9px 0 0;font-size:1.02rem;line-height:1.5;color:var(--ink-soft);max-width:32ch}

/* links */
.links{display:grid;gap:11px;margin-top:18px}
.btn{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;
  padding:9px 18px 9px 9px;border-radius:18px;text-decoration:none;color:#fff;outline:none;overflow:hidden;
  transition:transform .16s var(--ease-out),box-shadow .2s var(--ease-out);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.btn::before{content:"";position:absolute;inset:0 0 55% 0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0))}
.fb{background:#0866FF;box-shadow:0 12px 26px -12px rgba(8,102,255,.75)}
.ig{background:linear-gradient(100deg,#F58529 0%,#DD2A7B 34%,#8134AF 70%,#515BD4 100%);
  box-shadow:0 12px 26px -12px rgba(221,42,123,.7)}
.ig .lbl{text-shadow:0 1px 2px rgba(80,0,40,.3)}
.btn .ico{position:relative;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.16)}
.btn .ico img{display:block;width:36px;height:36px;pointer-events:none}
.btn .lbl{position:relative;font-size:1.08rem;font-weight:600;line-height:1.2}
.btn small{display:block;font-size:.84rem;font-weight:450;color:rgba(255,255,255,.9)}
.btn .arr{position:relative;width:20px;height:20px;opacity:.85;
  transition:transform .2s var(--ease-out)}
.btn:active{transform:scale(.975)}
.fb.lit{transform:scale(.978);box-shadow:0 0 0 4px rgba(8,102,255,.28),0 8px 18px -8px rgba(8,102,255,.6)}
.ig.lit{transform:scale(.978);box-shadow:0 0 0 4px rgba(221,42,123,.28),0 8px 18px -8px rgba(221,42,123,.6)}
.btn:focus-visible{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--gold)}
@media (hover:hover) and (pointer:fine){
  .btn:hover{transform:translate3d(0,-2px,0)}
  .btn:hover .arr{transform:translate3d(3px,-3px,0);opacity:1}
}

footer{margin-top:18px;font-size:.8rem;color:var(--ink-soft);opacity:.8}

.spark{position:fixed;width:12px;height:12px;pointer-events:none;z-index:10;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}

.rise{animation:rise .6s both var(--ease-out)}
.d1{animation-delay:.42s}.d2{animation-delay:.5s}.d3{animation-delay:.58s}
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .glow,.floor,.chip .dot,.figure{animation:none}
  .rise{animation:fade .3s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<div class="stage" aria-hidden="true"><i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i></div>

<main class="page">
  <p class="chip"><span class="dot" aria-hidden="true"></span>You tapped Rechelle's keychain</p>

  <section class="hero" aria-label="Rechelle">
    <div class="floor" aria-hidden="true"></div>
    <div class="figure" id="fig" role="button" tabindex="0" aria-label="Say hi to Rechelle">
      <div class="mover" id="mover">
        <img class="her" id="her" alt="Rechelle standing in a navy suit" draggable="false"
             width="300" height="1042" src="rechelle.webp">
      </div>
    </div>
    <div class="bubble" id="bubble" aria-hidden="true">Hi there!</div>
    <p class="tap">Tap her</p>
  </section>

  <section class="intro rise d1">
    <p class="role">Let's connect</p>
    <h1>Rechelle Suico</h1>
    <p>You found my keychain. Pick one below and come say hi.</p>
  </section>

  <nav class="links rise d2" aria-label="Social profiles">
    <a class="btn fb" id="btnFb" href="https://www.facebook.com/rechelle.suico/" target="_blank" rel="noopener noreferrer">
      <span class="ico"><img src="fb.webp" alt="" width="36" height="36" draggable="false"></span>
      <span class="lbl">Facebook<small>Add Rechelle Suico</small></span>
      <span class="arr"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M204,64V168a12,12,0,0,1-24,0V93L72.49,200.49a12,12,0,0,1-17-17L163,76H88a12,12,0,0,1,0-24H192A12,12,0,0,1,204,64Z"/></svg></span>
    </a>
    <a class="btn ig" id="btnIg" href="https://www.instagram.com/shelle_001" target="_blank" rel="noopener noreferrer">
      <span class="ico"><img src="ig.webp" alt="" width="36" height="36" draggable="false"></span>
      <span class="lbl">Instagram<small>@shelle_001</small></span>
      <span class="arr"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M204,64V168a12,12,0,0,1-24,0V93L72.49,200.49a12,12,0,0,1-17-17L163,76H88a12,12,0,0,1,0-24H192A12,12,0,0,1,204,64Z"/></svg></span>
    </a>
  </nav>

  <footer class="rise d3">Tap the keychain again anytime.</footer>
</main>

<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fig = document.getElementById('fig'), mover = document.getElementById('mover');
  var her = document.getElementById('her'), bubble = document.getElementById('bubble');
  var btnFb = document.getElementById('btnFb'), btnIg = document.getElementById('btnIg');

  var bt;
  function say(text, ms){
    bubble.textContent = text; bubble.classList.add('show');
    clearTimeout(bt); bt = setTimeout(function(){ bubble.classList.remove('show'); }, ms || 1800);
  }

  var gold = ['#C8963C','#E7C98A','#FFFFFF','#F3E2BC'];
  function sparkle(cx, cy, n){
    if(reduce) return;
    for(var i = 0; i < n; i++){
      (function(i){
        var s = document.createElement('div'); s.className = 'spark';
        s.style.background = gold[i % gold.length]; s.style.left = '0'; s.style.top = '0';
        var size = 7 + Math.random() * 9; s.style.width = s.style.height = size + 'px';
        document.body.appendChild(s);
        var a = Math.random() * Math.PI * 2, sp = 140 + Math.random() * 180;
        var x = cx, y = cy, vx = Math.cos(a) * sp, vy = Math.sin(a) * sp - 150;
        var rot = 0, life = 0, t0 = performance.now();
        function step(t){
          var dt = Math.min((t - t0) / 1000, .033); t0 = t; life += dt;
          vy += 580 * dt; x += vx * dt; y += vy * dt; rot += 320 * dt;
          s.style.transform = 'translate3d(' + (x - size/2) + 'px,' + (y - size/2) + 'px,0) rotate(' + rot + 'deg)';
          s.style.opacity = Math.max(0, 1 - life / 1);
          if(life < 1) requestAnimationFrame(step); else s.remove();
        }
        requestAnimationFrame(step);
      })(i);
    }
  }

  // pose springs: she shifts weight, steps toward a link, settles back
  var keys = ['lean', 'dx', 'dy', 'sc'];
  var rest = {lean: 0, dx: 0, dy: 0, sc: 1};
  var pose = {lean: 0, dx: 0, dy: 0, sc: 1};
  var vel = {lean: 0, dx: 0, dy: 0, sc: 0};
  var tgt = {lean: 0, dx: 0, dy: 0, sc: 1};
  var look = 0, busyUntil = 0, lastUser = 0, timers = [];
  function set(t){ for(var k in t) tgt[k] = t[k]; }
  function later(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function clearSeq(){ timers.forEach(clearTimeout); timers = []; }

  function hop(){
    her.classList.remove('hop'); void her.offsetWidth; her.classList.add('hop');
    clearTimeout(her._t); her._t = setTimeout(function(){ her.classList.remove('hop'); }, 650);
  }

  function offer(which, fromUser){
    var btn = which === 'fb' ? btnFb : btnIg, low = which === 'ig';
    clearSeq(); busyUntil = performance.now() + 1700;
    set({lean: low ? 2.2 : -2.2, dx: low ? 7 : -7, dy: low ? 11 : 7, sc: 1.015});
    later(430, function(){
      set({dy: low ? 15 : 11, sc: 1.035});
      btn.classList.add('lit');
      var r = btn.getBoundingClientRect();
      sparkle(r.left + 34, r.top + r.height / 2, 8);
      if(fromUser && navigator.vibrate) try{ navigator.vibrate(9); }catch(_){}
    });
    later(660, function(){ btn.classList.remove('lit'); set({sc: 1.015}); });
    later(730, function(){ say(which === 'fb' ? 'Add me on Facebook!' : 'Follow me on Instagram!', 1700); });
    later(1150, function(){ set(rest); });
  }

  var lines = ['Hi there!', 'Nice to meet you!', 'Glad you tapped!', 'Say hi below.'];
  var li = 0;
  function greet(){
    clearSeq(); set(rest); hop();
    li = (li + 1) % lines.length; say(lines[li]);
    var r = fig.getBoundingClientRect();
    sparkle(r.left + r.width / 2, r.top + r.height * 0.3, 12);
    busyUntil = performance.now() + 900; lastUser = performance.now();
    if(navigator.vibrate) try{ navigator.vibrate(11); }catch(_){}
  }
  fig.addEventListener('click', greet);
  fig.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); greet(); }
  });

  function hook(btn, which){
    btn.addEventListener('pointerenter', function(e){
      if(e.pointerType === 'mouse'){ lastUser = performance.now(); offer(which, true); }
    });
    btn.addEventListener('focus', function(){ lastUser = performance.now(); offer(which, true); });
    btn.addEventListener('touchstart', function(){ lastUser = performance.now(); }, {passive: true});
    btn.addEventListener('click', function(){
      lastUser = performance.now(); clearSeq(); set(rest); hop(); say('See you there!', 1600);
    });
  }
  hook(btnFb, 'fb'); hook(btnIg, 'ig');

  var turn = 'fb';
  setInterval(function(){
    var now = performance.now();
    if(reduce || now < busyUntil || now - lastUser < 4200 || document.hidden) return;
    offer(turn); turn = turn === 'fb' ? 'ig' : 'fb';
  }, 5600);
  setTimeout(function(){ say('Hi there!', 1400); }, 900);
  setTimeout(function(){ if(!reduce){ offer('fb'); turn = 'ig'; } }, 2500);

  function onPoint(e){
    var r = fig.getBoundingClientRect();
    look = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (window.innerWidth / 2)));
  }
  window.addEventListener('pointermove', onPoint);
  window.addEventListener('pointerdown', onPoint);
  document.addEventListener('pointerleave', function(){ look = 0; });

  var pt = performance.now();
  (function frame(now){
    var dt = Math.min((now - pt) / 1000, .033); pt = now;
    keys.forEach(function(k){
      vel[k] += ((tgt[k] - pose[k]) * 85 - vel[k] * 14) * dt;
      pose[k] += vel[k] * dt;
    });
    var t = now / 1000, m = reduce ? 0 : 1;
    var bob = Math.sin(t * 1.15) * 3.2 * m;
    var breath = Math.sin(t * 1.15 + .5) * .004 * m;
    var sway = Math.sin(t * .52) * .9 * m;
    var lx = now < busyUntil ? 0 : look;
    mover.style.transform =
      'translate3d(' + (pose.dx + lx * 7).toFixed(2) + 'px,' + (pose.dy + bob).toFixed(2) + 'px,0)' +
      ' rotate(' + (pose.lean + sway + lx * 1.2).toFixed(2) + 'deg)' +
      ' scale(' + pose.sc.toFixed(4) + ',' + (pose.sc * (1 + breath)).toFixed(4) + ')';
    requestAnimationFrame(frame);
  })(pt);
})();
</script>
</body>
</html>
